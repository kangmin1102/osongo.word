 <button class="s" onclick="list()">📋 단어 목록 보기</button>
 <button class="r" onclick="if(confirm('오답 기록 삭제?')){wrong=[];localStorage.removeItem('wrongWords');home()}">오답 초기화</button></div></div>`;}
let Q=[],i=0,sc=0,mode,bad=[];
function start(m){mode=m;Q=sh(pool());const n=+$('#cnt').value||20;Q=Q.slice(0,n);if(!Q.length){alert('단어가 없어요!');return}
 if(m!='card'&&Q.length<1)return;i=0;sc=0;bad=[];show();}
function head(){return `<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><small>${i+1} / ${Q.length}${mode!='card'?' · 점수 '+sc:''}</small>`}
function show(){if(i>=Q.length)return result();const w=Q[i];
 if(mode=='card'){app.innerHTML=`<div class="card">${head()}<div class="fc card" onclick="this.dataset.f=1;this.innerHTML='<div class=big>'+${JSON.stringify(esc(w[2]))}+'</div>'"><div class="big">${esc(w[0])}</div><small>${posName[w[1]]||''} · 클릭해서 뜻 확인</small></div>
 <div class="row" style="justify-content:center"><button class="g" onclick="i++;show()">알아요 ✅</button><button class="r" onclick="mark(Q[i]);i++;show()">몰라요 ❌</button></div><button class="s" onclick="home()">그만하기</button></div>`;return}
 if(mode=='type'){app.innerHTML=`<div class="card">${head()}<div class="big">${esc(w[2])}</div><div class="mid"><small>${posName[w[1]]||''} · ${w[0].length}글자</small></div>
 <input type="text" id="ans" autocomplete="off" autocapitalize="off" placeholder="영어 단어를 입력" onkeydown="if(event.key=='Enter')chk()"><p id="fb" class="mid"></p><button onclick="chk()" id="cb">확인</button><button class="s" onclick="home()">그만하기</button></div>`;$('#ans').focus();return}
 const e2k=mode=='mc1';const all=[].concat(...Object.values(DATA));
 let others=sh(all.filter(x=>(e2k?x[2]!=w[2]:x[0]!=w[0]))).slice(0,3);const opts=sh([w,...others]);
 app.innerHTML=`<div class="card">${head()}<div class="big">${esc(e2k?w[0]:w[2])}</div>${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(e2k?o[2]:o[0])}</button>`).join('')}<button class="s" onclick="home()">그만하기</button></div>`;
 document.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>{if(b.dataset.d)return;document.querySelectorAll('.opt').forEach(x=>x.dataset.d=1);
  if(opts[k]===w){b.classList.add('ok');sc++;unmark(w)}else{b.classList.add('no');document.querySelectorAll('.opt')[opts.indexOf(w)].classList.add('ok');mark(w)}
  setTimeout(()=>{i++;show()},1100)});}
function mark(w){if(!bad.includes(w))bad.push(w);if(!wrong.includes(key(w)))wrong.push(key(w));localStorage.setItem('wrongWords',JSON.stringify(wrong))}
function unmark(w){if(mode!='card'){wrong=wrong.filter(x=>x!=key(w));localStorage.setItem('wrongWords',JSON.stringify(wrong))}}
function chk(){const w=Q[i];if($('#cb').dataset.n){i++;show();return}
 const ok=norm($('#ans').value)==norm(w[0]);$('#cb').dataset.n=1;$('#cb').textContent='다음 ▶';$('#ans').disabled=true;
 $('#fb').innerHTML=ok?'<b>⭕ 정답!</b>':'<b style="text-decoration:underline">❌ 정답: '+esc(w[0])+'</b>';
 if(ok){sc++;unmark(w)}else mark(w);$('#cb').focus();$('#cb').onclick=()=>{i++;show()};}
function result(){const n=Q.length;app.innerHTML=`<div class="card"><h2>결과</h2>${mode=='card'?`<p>알아요 ${n-bad.length} / ${n}</p>`:`<p class="big">${sc} / ${n} (${Math.round(sc/n*100)}점)</p>`}
 ${bad.length?`<h3>틀린 단어</h3><table>${bad.map(w=>`<tr><td><b>${esc(w[0])}</b></td><td>${esc(w[2])}</td></tr>`).join('')}</table>`:'<p>🎉 모두 맞혔어요!</p>'}
 <button onclick="home()">처음으로</button></div>`;}
function list(){const p=pool();app.innerHTML=`<div class="card"><button class="s" onclick="home()">← 돌아가기</button><h3>단어 목록 (${p.length})</h3>
 <input type="text" placeholder="검색" oninput="document.querySelectorAll('#t tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')">
 <table id="t">${p.map(w=>`<tr><td><b>${esc(w[0])}</b> <small>${w[1]}</small></td><td>${esc(w[2])}</td></tr>`).join('')}</table></div>`;}
home();
</script></body></html>
